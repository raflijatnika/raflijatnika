name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#1D1D1F&color_dots=#EBEBF0,#D2D2D7,#AEAEB2,#6E6E73,#1D1D1F
            dist/snake-dark.svg?color_snake=#F5F5F7&color_dots=#1C1C1E,#3A3A3C,#636366,#AEAEB2,#F5F5F7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
